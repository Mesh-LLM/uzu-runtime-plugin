name: macOS package
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package:
    # Metal 4 / macOS 26.4 SDK is required by pinned Uzu (not macos-15).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Verify full package
        run: |
          ulimit -n 8192
          rustup run 1.99.0 cargo fmt --all --check
          rustup run 1.99.0 cargo clippy --locked --all-targets -- -D warnings
          rustup run 1.99.0 cargo test --locked
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=${GITHUB_REF_NAME#v}
          grep -qx "version = \"$v\"" Cargo.toml
          grep -qx "version = \"$v\"" plugin.toml
      - name: Fetch pinned engine
        run: |
          git clone --filter=blob:none https://github.com/trymirai/uzu.git "$RUNNER_TEMP/uzu"
          git -C "$RUNNER_TEMP/uzu" checkout --detach 0d60981a899c79fc1c29ab3ca1c5aeff937affff
      - name: Build, sign, package and smoke extracted archive
        run: bash scripts/package-macos.sh "$RUNNER_TEMP/uzu"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uzu-runtime-plugin-macos
          if-no-files-found: error
          path: dist/uzu-runtime-plugin-aarch64-apple-darwin.tar.gz*
      - name: Clean
        if: always()
        run: |
          rustup run 1.99.0 cargo clean
          if test -f "$RUNNER_TEMP/uzu/Cargo.toml"; then rustup run 1.99.0 cargo clean --manifest-path "$RUNNER_TEMP/uzu/Cargo.toml"; fi
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: uzu-runtime-plugin-macos
          path: dist
      - name: Publish exact tested archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum -c ./*.sha256
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Uzu runtime $GITHUB_REF_NAME" \
            --notes 'Apple Silicon, macOS 26.4+. Ad-hoc signed; not notarized. Includes pinned patched Uzu and licenses. See README for model arguments.' \
            ./*.tar.gz ./*.sha256
